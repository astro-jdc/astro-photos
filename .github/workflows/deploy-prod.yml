name: deploy-prod

# Merge a `main` → producción (`astrophotos.app`). Ver `docs/branching.md`.
#
# Diferencias con staging, todas deliberadas:
#   * el job de despliegue usa el GitHub Environment `production`, que exige
#     **aprobación manual** de un revisor antes de arrancar;
#   * ECS despliega en **blue/green** con CodeDeploy y rollback automático si
#     las alarmas de 5xx o latencia p99 saltan en los 10 minutos siguientes;
#   * al terminar se crea el tag `v<AÑO>.<MES>.<N>` y la release con changelog.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  ENVIRONMENT: prod
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # Se construye ANTES de pedir la aprobación: así el revisor aprueba algo que
  # ya se sabe que compila, y la ventana entre "sí" y "desplegado" es corta.
  build:
    name: build de imagenes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging # el entorno solo aporta el rol OIDC de build
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "image_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: infra/requirements.txt

      - name: Credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: build-prod-${{ github.run_id }}

      - name: Instalar dependencias de infra
        working-directory: infra
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: cdk deploy Ecr
        working-directory: infra
        run: cdk deploy "AstroPhotos-${ENVIRONMENT}-Ecr" -c env=$ENVIRONMENT --require-approval never

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: Build y push del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/arm64
          tags: ${{ steps.ecr.outputs.registry }}/astro-photos-prod-backend:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,scope=backend-prod,mode=max
          provenance: false

      - name: Build y push de models
        uses: docker/build-push-action@v6
        with:
          context: ./models
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ecr.outputs.registry }}/astro-photos-prod-models:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=models-prod
          cache-to: type=gha,scope=models-prod,mode=max
          provenance: false

  deploy:
    name: deploy produccion
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: build
    # <<< aprobación manual: el entorno `production` tiene revisor obligatorio >>>
    environment:
      name: production
      url: https://astrophotos.app
    outputs:
      image_tag: ${{ needs.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: infra/requirements.txt

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-prod-${{ github.run_id }}

      - name: Instalar dependencias de infra
        working-directory: infra
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: cdk deploy
        working-directory: infra
        run: |
          cdk deploy --all \
            -c env=$ENVIRONMENT \
            -c backend_image_tag=${{ needs.build.outputs.image_tag }} \
            -c models_image_tag=${{ needs.build.outputs.image_tag }} \
            -c hosted_zone_id=${{ vars.HOSTED_ZONE_ID }} \
            --require-approval never \
            --outputs-file /tmp/outputs.json

      - name: Exportar las salidas del stack
        id: outputs
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open("/tmp/outputs.json"))
          flat = {k: v for stack in data.values() for k, v in stack.items()}
          for key in (
              "ClusterName",
              "MigrationsTaskDefinitionArn",
              "MigrationsSubnets",
              "MigrationsSecurityGroup",
              "SiteBucketName",
              "DistributionId",
              "CodeDeployApplication",
              "CodeDeployDeploymentGroup",
          ):
              print(f"{key}={flat.get(key, '')}")
          PY

      # Expand → migrate → contract: la migración es compatible hacia atrás, así
      # que puede correr con la versión antigua todavía sirviendo tráfico.
      - name: Migraciones de Alembic
        run: |
          set -euo pipefail
          task_arn=$(aws ecs run-task \
            --cluster "${{ steps.outputs.outputs.ClusterName }}" \
            --task-definition "${{ steps.outputs.outputs.MigrationsTaskDefinitionArn }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ steps.outputs.outputs.MigrationsSubnets }}],securityGroups=[${{ steps.outputs.outputs.MigrationsSecurityGroup }}],assignPublicIp=DISABLED}" \
            --started-by "gha-${GITHUB_RUN_ID}" \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "${{ steps.outputs.outputs.ClusterName }}" --tasks "$task_arn"
          exit_code=$(aws ecs describe-tasks \
            --cluster "${{ steps.outputs.outputs.ClusterName }}" --tasks "$task_arn" \
            --query "tasks[0].containers[?name=='migrate'].exitCode | [0]" --output text)
          test "$exit_code" = "0"

      - name: Esperar al despliegue blue/green
        run: |
          set -euo pipefail
          app="${{ steps.outputs.outputs.CodeDeployApplication }}"
          group="${{ steps.outputs.outputs.CodeDeployDeploymentGroup }}"
          deployment=$(aws deploy list-deployments \
            --application-name "$app" --deployment-group-name "$group" \
            --include-only-statuses Created Queued InProgress Ready \
            --query 'deployments[0]' --output text)
          if [ "$deployment" = "None" ] || [ -z "$deployment" ]; then
            echo "CodeDeploy no tiene despliegues en curso (cdk deploy ya lo completo)"
            exit 0
          fi
          echo "Esperando a $deployment"
          # Si las alarmas de 5xx o p99 saltan, CodeDeploy revierte solo y este
          # wait falla: el workflow se pone rojo y produccion queda en la version
          # anterior, que es exactamente lo que queremos.
          aws deploy wait deployment-successful --deployment-id "$deployment"

      - name: Build del frontend
        working-directory: frontend
        env:
          NUXT_PUBLIC_API_BASE: https://astrophotos.app/api/v1
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Sync a S3
        run: |
          set -euo pipefail
          bucket="${{ steps.outputs.outputs.SiteBucketName }}"
          aws s3 sync frontend/.output/public "s3://$bucket" \
            --delete --exclude "*.html" --exclude "*.json" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync frontend/.output/public "s3://$bucket" \
            --delete --exclude "*" --include "*.html" --include "*.json" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidar CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.DistributionId }}" \
            --paths "/*" >/dev/null

      - name: Smoke test de /readyz
        run: |
          set -euo pipefail
          for intento in $(seq 1 30); do
            code=$(curl -s -o /tmp/readyz.json -w "%{http_code}" https://astrophotos.app/api/v1/readyz || true)
            [ "$code" = "200" ] && { cat /tmp/readyz.json; exit 0; }
            echo "intento $intento: HTTP $code"
            sleep 10
          done
          cat /tmp/readyz.json || true
          exit 1

  release:
    name: tag y release
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular el tag v<ANIO>.<MES>.<N>
        id: tag
        run: |
          set -euo pipefail
          prefix="v$(date -u +%Y).$(date -u +%-m)."
          # N es el numero de release de este mes, empezando en 1.
          ultimo=$(git tag --list "${prefix}*" | sed "s|^${prefix}||" | sort -n | tail -1)
          siguiente=$(( ${ultimo:-0} + 1 ))
          echo "tag=${prefix}${siguiente}" >> "$GITHUB_OUTPUT"

      - name: Changelog desde el tag anterior
        id: changelog
        run: |
          set -euo pipefail
          anterior=$(git tag --list 'v*' --sort=-creatordate | head -1)
          {
            echo 'body<<CHANGELOG'
            if [ -n "$anterior" ]; then
              echo "### Cambios desde \`$anterior\`"
              echo
              git log --no-merges --pretty='- %s (%an)' "${anterior}..HEAD"
            else
              echo "### Primera release"
              echo
              git log --no-merges --pretty='- %s (%an)' | head -50
            fi
            echo
            echo "Imagen desplegada: \`${{ needs.deploy.outputs.image_tag }}\`"
            echo CHANGELOG
          } >> "$GITHUB_OUTPUT"

      - name: Crear tag y release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "${{ steps.changelog.outputs.body }}"
