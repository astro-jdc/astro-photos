name: ci

# Los cuatro componentes se validan EN PARALELO. Los nombres de los jobs son
# exactamente los checks obligatorios de `docs/branching.md`:
# ci/backend, ci/frontend, ci/infra, ci/models.

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # --------------------------------------------------------------- backend --
  backend:
    name: ci/backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # PostGIS de verdad: los tests de repositorio usan geography(Point,4326),
      # pgvector y citext, y ninguno de los tres existe en un SQLite.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: astro
          POSTGRES_PASSWORD: astro
          POSTGRES_DB: astrophotos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U astro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://astro:astro@localhost:5432/astrophotos_test
      DATABASE_URL_TEST: postgresql+asyncpg://astro:astro@localhost:5432/astrophotos_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install -U pip
          pip install -e "./backend[dev]"

      - name: Extensiones de PostgreSQL
        run: |
          PGPASSWORD=astro psql -h localhost -U astro -d astrophotos_test -v ON_ERROR_STOP=1 \
            -f scripts/init-db.sql

      - name: ruff
        run: |
          ruff check backend
          ruff format --check backend

      - name: mypy
        run: mypy backend/app

      - name: pytest
        run: pytest backend/tests -q --cov=backend/app --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  # -------------------------------------------------------------- frontend --
  frontend:
    name: ci/frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/.output/public
          retention-days: 3
          if-no-files-found: ignore

  # ---------------------------------------------------------------- models --
  models:
    name: ci/models
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: models/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install -U pip
          pip install -e "./models[dev]"

      - name: ruff
        run: ruff check models

      - name: pytest
        # Los tests de `models/` corren en CPU: nada aquí puede necesitar GPU.
        run: pytest models/tests -q

  # ----------------------------------------------------------------- infra --
  infra:
    name: ci/infra
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra
    env:
      # `cdk synth` no despliega nada ni necesita credenciales. La cuenta y la
      # región se pasan por contexto (no por variables de entorno) porque el CLI
      # de CDK sobrescribe CDK_DEFAULT_* con lo que resuelva el SDK.
      CDK_CONTEXT: -c account=111122223333 -c region=eu-west-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: infra/requirements.txt

      # `aws-cdk-cli` (en requirements.txt) trae el CLI: no hace falta npm aquí.
      - name: Instalar dependencias
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt ruff

      - name: ruff
        run: ruff check .

      - name: pytest
        run: python -m pytest tests -q

      - name: cdk synth staging
        run: cdk synth -c env=staging $CDK_CONTEXT --quiet

      - name: cdk synth prod
        run: cdk synth -c env=prod $CDK_CONTEXT --quiet

  # Check agregado: una sola cosa que mirar en la rama protegida.
  ci-ok:
    name: ci/all
    runs-on: ubuntu-latest
    needs: [backend, frontend, models, infra]
    if: always()
    steps:
      - name: Comprobar que ningun job fallo
        run: |
          if echo '${{ join(needs.*.result, ' ') }}' | grep -qE 'failure|cancelled'; then
            echo "Algun job de CI no paso"
            exit 1
          fi
