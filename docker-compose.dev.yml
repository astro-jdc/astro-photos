# Entorno de desarrollo local. `make up` / `make down`.
services:
  db:
    # PostGIS + pgvector: ninguna imagen oficial trae las dos. Ver scripts/db.Dockerfile.
    build:
      context: ./scripts
      dockerfile: db.Dockerfile
    image: astro-photos/postgis-pgvector:16
    environment:
      POSTGRES_USER: astro
      POSTGRES_PASSWORD: astro
      POSTGRES_DB: astrophotos
    ports: ["5432:5432"]
    volumes:
      - astro-db:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astro -d astrophotos"]
      interval: 5s
      retries: 10

  minio:
    image: docker.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - astro-minio:/data

  createbuckets:
    image: docker.io/minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/astro-photos-dev-uploads;
      mc mb -p local/astro-photos-dev-originals;
      mc mb -p local/astro-photos-dev-derived;
      mc anonymous set none local/astro-photos-dev-originals;
      exit 0"

  sqs:
    image: docker.io/softwaremill/elasticmq-native:latest
    ports: ["9324:9324"]
    volumes:
      - ./scripts/elasticmq.conf:/opt/elasticmq.conf:ro

volumes:
  astro-db:
  astro-minio:
