# Mismo estilo que `backend/pyproject.toml`: un solo criterio en todo el repo.
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "cdk.out", "node_modules"]

[lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # Los constructos de CDK reciben `scope`/`id` posicionales por contrato.
    "N803",
    # `dict(...)` se usa a proposito para bloques de props que luego se pasan
    # con `**` a varios constructos.
    "C408",
    # El texto y los comentarios estan en castellano: guiones largos y comillas
    # tipograficas son correctos, no "caracteres ambiguos".
    "RUF001",
    "RUF002",
    "RUF003",
]

[lint.per-file-ignores]
# Los imports de los stacks van después de tocar `sys.path`.
"tests/conftest.py" = ["E402"]
"tests/*" = ["E501"]

[format]
docstring-code-format = true
