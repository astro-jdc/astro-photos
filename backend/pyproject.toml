[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-photos-backend"
version = "0.1.0"
description = "astro-photos — API FastAPI: fotos, licencias, reconstrucciones"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "astro-photos" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "geoalchemy2>=0.16",
    "pgvector>=0.3.6",
    "boto3>=1.35",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "structlog>=24.4",
    "numpy>=2.1",
    "pillow>=11.0",
    "piexif>=1.1.3",
    "python-multipart>=0.0.17",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.8",
    "schemathesis>=3.38",
    "aiosqlite>=0.20",
    "types-boto3>=1.35",
]

[project.urls]
Homepage = "https://github.com/astro-photos/astro-photos"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed"]

# --------------------------------------------------------------------------- #
# ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF",
    "ASYNC",
]
ignore = [
    "B008",   # FastAPI Depends() en defaults es idiomático
    "RUF012", # ClassVar en modelos declarativos
]

# La documentación está en español y usa notación científica: la raya, el signo de
# multiplicación, sigma y las flechas son intencionados, no confusiones tipográficas.
allowed-confusables = ["–", "—", "×", "σ", "⇒", "≈", "·", "λ", "µ", "α", "β", "θ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"migrations/**" = ["E501", "N999"]

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "geoalchemy2.*",
    "pgvector.*",
    "boto3.*",
    "botocore.*",
    "piexif.*",
    "sse_starlette.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: necesita PostGIS real (testcontainers o DATABASE_URL_TEST)",
]

[tool.coverage.run]
source = ["app"]
branch = true
