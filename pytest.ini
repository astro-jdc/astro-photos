[pytest]
testpaths = tests
python_files = test_*.py
markers =
    integration: necesita el stack local (postgis + minio + backend en marcha)
    contract: compara el OpenAPI del backend con los tipos del frontend
    slow: tarda más de unos segundos
    invariant: invariante transversal (licencias, privacidad, reproducibilidad)
filterwarnings =
    ignore::DeprecationWarning
