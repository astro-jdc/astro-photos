[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrostack"
version = "0.1.0"
description = "Physically-correct multi-observer astronomical image reconstruction (Tier A classical coaddition + Tier B learned burst SR scaffolding)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
authors = [{ name = "astro-photos" }]
keywords = ["astronomy", "stacking", "drizzle", "coaddition", "super-resolution"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
]

# Base dependencies: everything Tier A needs. torch is deliberately NOT here.
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "astropy>=6.1,<9",
  "photutils>=2.0,<4",
  "reproject>=0.13,<1",
  "astroalign>=2.5,<3",
  "sep>=1.4,<2",
  "rawpy>=0.22,<1",
  "pillow>=10.3,<14",
  "tifffile>=2024.5,<2027",
  "pyyaml>=6.0,<7",
  "pydantic>=2.7,<3",
  "click>=8.1,<9",
  "structlog>=24.1,<27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "pytest-cov>=5.0,<8",
  "ruff>=0.5,<1",
  "hypothesis>=6.100,<7",
]
# Tier B only. Never imported at package import time; see astrostack/sr/_torch.py.
torch = [
  "torch>=2.3",
]

[project.scripts]
astrostack = "astrostack.cli:main"

[project.urls]
Repository = "https://github.com/astro-photos/astro-photos"

[tool.setuptools.packages.find]
where = ["."]
include = ["astrostack*", "training*"]

[tool.setuptools.package-data]
astrostack = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "C4",  # comprehensions
  "SIM", # simplify
  "RUF", # ruff-specific
  "NPY", # numpy-specific
  "BLE", # blind except
]
ignore = [
  "E501",   # line length handled by formatter
  "B008",   # function call in default arg (click decorators)
  "RUF012", # mutable class attrs need ClassVar
  "SIM108", # ternary is not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"tests/synthetic.py" = ["C408"]
"tests/conftest.py" = ["C408"]
"tests/test_optimal_coadd.py" = ["C408"]

[tool.ruff.lint.isort]
known-first-party = ["astrostack", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
  "ignore::UserWarning",
]
markers = [
  "slow: long-running end-to-end tests",
  "torch: requires the [torch] extra",
]
